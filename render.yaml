# MEDAI · Render Blueprint
# Connect your GitHub repo on render.com → New → Blueprint → pick this repo.
# Fill in the secret env vars (AI_API_KEY, SECRET_KEY) in the Render dashboard.

services:
  # ---- Backend (FastAPI) ----
  - type: web
    name: medai-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: openai            # set to "mock" to run the demo provider
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_API_KEY
        sync: false              # ← paste your key in the Render dashboard (never in Git)
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false              # ← paste your Postgres connection string when you add a database
      - key: CORS_ORIGINS
        value: https://medai.onrender.com
      - key: RATE_LIMIT_PER_MIN
        value: "60"

  # ---- Frontend (Vite static site) ----
  - type: web
    name: medai-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://medai-api.onrender.com   # ← replace with your backend URL after first deploy
